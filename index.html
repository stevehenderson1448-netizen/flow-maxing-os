<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="A calm operating system for meaningful work, energy matching, and recovery." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Flow Maxing</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-view-target="today" aria-label="Go to today">
          <span class="brand-mark">F</span>
          <span>Flow Maxing</span>
        </button>
        <button class="icon-button" id="open-settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.08A1.7 1.7 0 0 0 12.38 18a1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.42 15a1.7 1.7 0 0 0-1.56-1.03H7.8v-2h.08a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.43 6.4V6h2v.4a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21v2h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </header>

      <main>
        <section class="view active" id="view-today" aria-labelledby="today-heading"></section>
        <section class="view" id="view-week" aria-labelledby="week-heading"></section>
        <section class="view" id="view-architecture" aria-labelledby="architecture-heading"></section>
        <section class="view" id="view-review" aria-labelledby="review-heading"></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view-target="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8 2v4M16 2v4M5 9h14"/></svg>
          <span>Today</span>
        </button>
        <button class="nav-item" data-view-target="week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M8 3v6M16 3v6M4 10h16"/></svg>
          <span>Week</span>
        </button>
        <button class="nav-item" data-view-target="architecture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8M17 8l-4 8"/></svg>
          <span>System</span>
        </button>
        <button class="nav-item" data-view-target="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg>
          <span>Review</span>
        </button>
      </nav>
    </div>

    <dialog id="editor-dialog" class="editor-dialog">
      <form method="dialog" id="editor-form">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="dialog-eyebrow">Edit</p>
            <h2 id="dialog-title">Item</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <div class="dialog-actions">
          <button class="button button-ghost hidden" type="button" id="delete-item">Delete</button>
          <button class="button button-primary" value="default" id="save-item">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="editor-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <div><p class="eyebrow">Your data</p><h2>Settings</h2></div>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <div class="settings-list">
          <button type="button" class="settings-row" id="export-data"><span><strong>Export backup</strong><small>Save everything as a file</small></span><span>↓</span></button>
          <label class="settings-row file-row"><span><strong>Import backup</strong><small>Restore a previous export</small></span><span>↑</span><input id="import-data" type="file" accept="application/json" /></label>
          <button type="button" class="settings-row danger-row" id="reset-data"><span><strong>Reset app</strong><small>Return to the starter system</small></span><span>↺</span></button>
        </div>
        <p class="privacy-note">Everything stays in this browser unless you export it.</p>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
