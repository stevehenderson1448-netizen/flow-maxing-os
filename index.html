<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b090a" />
    <meta name="description" content="A connected personal operating system for money, routines, clarity, execution, and life." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>50X Life OS</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" data-view-target="today" aria-label="Go to today">
          <span class="brand-mark">50X</span>
          <span class="brand-copy"><strong>Life OS</strong><small>Personal command system</small></span>
        </button>
        <div class="top-actions">
          <span class="local-status" id="cloud-status"><i></i><span>Private</span></span>
          <button class="icon-button capture-button" id="quick-capture" aria-label="Quick capture">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-button" id="open-settings" aria-label="Open settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.08A1.7 1.7 0 0 0 12.38 18a1.7 1.7 0 0 0-1.88.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.42 15a1.7 1.7 0 0 0-1.56-1.03H7.8v-2h.08a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.42-1.42.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 13.43 6.4V6h2v.4a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.42 1.42-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.03H21v2h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
          </button>
        </div>
      </header>

      <main>
        <section class="view active" id="view-today" aria-labelledby="today-heading"></section>
        <section class="view" id="view-money" aria-labelledby="money-heading"></section>
        <section class="view" id="view-week" aria-labelledby="week-heading"></section>
        <section class="view" id="view-architecture" aria-labelledby="architecture-heading"></section>
        <section class="view" id="view-review" aria-labelledby="review-heading"></section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view-target="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8 2v4M16 2v4M5 9h14"/></svg>
          <span>Today</span>
        </button>
        <button class="nav-item" data-view-target="money">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v13H3z"/><path d="M16 10h5v5h-5a2.5 2.5 0 0 1 0-5Z"/><path d="M7 6V4h10v2"/></svg>
          <span>Money</span>
        </button>
        <button class="nav-item" data-view-target="week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v5c0 5 3.4 8 8 9 4.6-1 8-4 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Focus</span>
        </button>
        <button class="nav-item" data-view-target="architecture">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8M17 8l-4 8"/></svg>
          <span>System</span>
        </button>
        <button class="nav-item" data-view-target="review">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg>
          <span>Review</span>
        </button>
      </nav>
    </div>

    <dialog id="editor-dialog" class="editor-dialog">
      <form method="dialog" id="editor-form">
        <div class="dialog-head">
          <div>
            <p class="eyebrow" id="dialog-eyebrow">Edit</p>
            <h2 id="dialog-title">Item</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog="editor-dialog" aria-label="Close">×</button>
        </div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <div class="dialog-actions">
          <button class="button button-ghost hidden" type="button" id="delete-item">Delete</button>
          <button class="button button-primary" value="default" id="save-item">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="editor-dialog">
      <form method="dialog">
        <div class="dialog-head">
          <div><p class="eyebrow">50X Life OS</p><h2>Settings</h2></div>
          <button class="icon-button" type="button" data-close-dialog="settings-dialog" aria-label="Close">×</button>
        </div>
        <div class="settings-list">
          <p class="settings-section-label">Personalise</p>
          <button type="button" class="settings-row" id="edit-routines"><span><strong>Routine modes</strong><small>Customise Minimum, Standard and Peak</small></span><span>›</span></button>
          <button type="button" class="settings-row" id="reminder-settings"><span><strong>Gentle reminders</strong><small id="reminder-status">Off</small></span><span>›</span></button>
          <button type="button" class="settings-row" id="security-settings"><span><strong>App lock</strong><small id="security-status">Off</small></span><span>›</span></button>
          <p class="settings-section-label">Data + devices</p>
          <button type="button" class="settings-row sync-settings-row" id="device-sync"><span><strong>Encrypted device sync</strong><small id="sync-status">Not connected · this device only</small></span><span id="sync-action">›</span></button>
          <button type="button" class="settings-row" id="create-handoff"><span><strong>Secure phone handoff</strong><small>Share an encrypted copy with another device</small></span><span>↗</span></button>
          <label class="settings-row file-row"><span><strong>Import secure handoff</strong><small>Open an encrypted 50X transfer file</small></span><span>↑</span><input id="import-handoff" type="file" accept=".50x,application/json" /></label>
          <button type="button" class="settings-row" id="export-data"><span><strong>Export backup</strong><small>Save everything as a file</small></span><span>↓</span></button>
          <label class="settings-row file-row"><span><strong>Import backup</strong><small>Restore a previous export</small></span><span>↑</span><input id="import-data" type="file" accept="application/json" /></label>
          <p class="settings-section-label">Reset</p>
          <button type="button" class="settings-row danger-row" id="reset-data"><span><strong>Reset app</strong><small>Return to the 50X starter system</small></span><span>↺</span></button>
        </div>
        <p class="privacy-note" id="privacy-note">Your data stays private to this browser unless you deliberately transfer it.</p>
      </form>
    </dialog>

    <section id="lock-screen" class="lock-screen hidden" aria-labelledby="lock-heading">
      <div class="lock-panel">
        <span class="brand-mark lock-mark">50X</span>
        <p class="eyebrow">Private system</p>
        <h1 id="lock-heading">Life OS is locked.</h1>
        <p>Use your PIN or this device's secure unlock.</p>
        <form id="unlock-form">
          <input id="unlock-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="Enter PIN" aria-label="PIN" />
          <button class="button button-primary" type="submit">Unlock</button>
        </form>
        <button class="button button-secondary button-wide hidden" id="device-unlock" type="button">Use Face ID / device unlock</button>
        <p class="lock-error" id="lock-error" role="alert"></p>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
